name: Check pull request

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;36.0.0"

      - name: Test, lint and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-pr-${{ github.event.pull_request.number }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
