name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

      - name: Prepare optional release signing
        id: signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > release.jks
            printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require permanent signing for version releases
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.configured != 'true'
        run: |
          echo "::error::Version releases require SIGNING_KEY_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD"
          exit 1

      - name: Test and build APK
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew testDebugUnitTest lintDebug 2>&1 | tee gradle.log; then
            DETAILS="$(tail -n 100 gradle.log)"
            DETAILS="${DETAILS//'%'/'%25'}"
            DETAILS="${DETAILS//$'\r'/'%0D'}"
            DETAILS="${DETAILS//$'\n'/'%0A'}"
            echo "::error title=Gradle build details::$DETAILS"
            exit 1
          fi
          if [ "${{ steps.signing.outputs.configured }}" = "true" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anyuta-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK_PATH="$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          RELEASE_APK="anyuta-${GITHUB_REF_NAME}.apk"
          cp "$APK_PATH" "$RELEASE_APK"
          gh release create "$GITHUB_REF_NAME" "$RELEASE_APK" \
            --title "Анюта ${GITHUB_REF_NAME}" \
            --generate-notes
